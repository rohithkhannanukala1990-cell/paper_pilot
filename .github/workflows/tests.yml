name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            pymupdf \
            python-dotenv \
            fastapi \
            httpx \
            python-multipart \
            rank-bm25 \
            chromadb \
            anthropic \
            tenacity \
            pydantic

      - name: Run tests
        run: python -m pytest -q
