services:
  ui:
    build: .
    image: paperpilot:latest
    command: >
      streamlit run streamlit_app.py
      --server.address 0.0.0.0
      --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_DIR: data/chroma
      UPLOAD_DIR: data/papers
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build: .
    image: paperpilot:latest
    command: >
      uvicorn api:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CHROMA_DIR: data/chroma
      UPLOAD_DIR: data/papers
    volumes:
      - ./data:/app/data
    restart: unless-stopped
